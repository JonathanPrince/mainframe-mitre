name: Deploy to GitHub Pages\n\non:\n  push:\n    branches:\n      - main  # Trigger this workflow when pushing to the main branch\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v2\n\n      - name: Set up Node.js\n        uses: actions/setup-node@v2\n        with:\n          node-version: '14'  # Use the desired Node.js version\n      \n      - name: Install dependencies\n        run: npm install\n\n      - name: Build project\n        run: npm run build  # Adjust this command based on your build script\n\n      - name: Deploy to GitHub Pages\n        uses: peaceiris/actions-gh-pages@v3\n        with:\n          github_token: ${{ secrets.GITHUB_TOKEN }}\n          publish_dir: ./dist  # Adjust this to the directory where your static assets are\n          publish_branch: gh-pages\n