name: Build & Deploy to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches:
      - main  # Trigger this workflow when pushing to the main branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'  # Use the desired Node.js version
      
      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build  # Adjust this command based on your build script

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # Adjust this to the directory where your static assets are
          publish_branch: gh-pages
